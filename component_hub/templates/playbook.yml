site:
  title: Commodore Hub
  url: https://hub.syn.tools
  start_page: hub::index.adoc
  keys:
    google_analytics: "UA-54393406-10"
content:
  sources:
    - url: . # The current folder is a git repo
      branches: HEAD # "HEAD" uses whichever branch is currently checked out
      start_path: docs
ui:
  bundle:
    url: https://github.com/vshn/antora-ui/releases/download/v3.2.0/ui-bundle-syn.zip
    snapshot: false
  supplemental_files:
    - path: ui.yml
      contents: |
        static_files: [ .nojekyll ]
    - path: .nojekyll
asciidoc:
  attributes:
    page-pagination: ""
    hide-uri-scheme: ""
    experimental: ""
    stem: ""
    icons: font
    kroki-server-url: https://kroki.vshn.net
    kroki-fetch-diagram: ""
  extensions:
    - asciidoctor-kroki
output:
  destinations:
    - provider: fs
      path: ./_public
      clean: true
